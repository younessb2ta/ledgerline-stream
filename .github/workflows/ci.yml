name: ci

# `eventforge` is an editable path dependency on ../ledgerline-batch, so the
# stream repo cannot be tested alone. Both repos are checked out as siblings.
# They must share an owner (or edit `repository:` below). For private repos,
# add a BATCH_REPO_TOKEN secret with read access to ledgerline-batch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ledgerline-batch (path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ledgerline-batch
          path: ledgerline-batch
          token: ${{ secrets.BATCH_REPO_TOKEN || github.token }}

      - name: Check out ledgerline-stream
        uses: actions/checkout@v4
        with:
          path: ledgerline-stream

      # pgserver ships wheels only for cp311/cp312. Pin the interpreter so
      # a newer runner default cannot break `uv sync --frozen`.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: ledgerline-stream
        run: uv sync --frozen

      - name: Lint
        working-directory: ledgerline-stream
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: ledgerline-stream
        run: uv run pytest

  flink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build the job jar
        working-directory: flink-job
        run: mvn -B -DskipTests package
