[project]
name = "ledgerline-stream"
version = "0.1.0"
description = "Kafka -> Flink -> Postgres -> Streamlit provisional ledger"
requires-python = ">=3.11"
dependencies = [
    "eventforge",
    "confluent-kafka>=2.3",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
    "pandas>=2.2",
    "requests>=2.32",
    "cryptography<49",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
eventforge = { path = "../ledgerline-batch/packages/eventforge", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
